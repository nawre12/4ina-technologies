<section id="faq" class="faq-section">
    <div class="container">
        <div class="row justify-content-center text-center mb-5">
            <div class="col-lg-8">
                <span
                    class="badge bg-soft-primary px-3 py-2 rounded-pill mb-3 text-primary fw-bold text-uppercase">FAQ</span>
                <h2 class="display-5 fw-bold mb-4">Frequently Asked <span class="gradient-text">Questions</span></h2>
                <p class="lead text-muted">Find answers to common questions about our technology and how we can help
                    your business.</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="faq-accordion">
                    <div *ngFor="let faq of faqs; let i = index" class="faq-item premium-card mb-3"
                        [class.active]="faq.isOpen">
                        <button
                            class="faq-header d-flex justify-content-between align-items-center w-100 py-4 px-4 border-0 bg-transparent text-start"
                            (click)="toggleFaq(i)">
                            <span class="fw-bold fs-5 text-dark">{{ faq.question }}</span>
                            <div class="faq-icon-wrapper ms-3">
                                <i class="fas" [class.fa-plus]="!faq.isOpen" [class.fa-minus]="faq.isOpen"></i>
                            </div>
                        </button>
                        <div class="faq-content overflow-hidden px-4" [style.max-height]="faq.isOpen ? '300px' : '0'">
                            <p class="pb-4 mb-0 text-muted">
                                {{ faq.answer }}
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
